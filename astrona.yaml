# Course manifest for ATS056 - Installation and Configuration (Cilium Certified Associate).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes last. The section capstone and the section quiz close the section.
# Playgrounds are not listed: the landing page's playground marker shows
# them. solution.md is never listed. All labs are UNTESTED: never run.
#
# Every `path:` is relative to this file.

training:
  id: ATS056
  title: "CCA: Installation and Configuration"
  description: >
    Training material covering the Installation and Configuration domain of
    the Cilium Certified Associate (CCA) exam: reading and changing the
    configuration of a running Cilium installation with the Cilium CLI, and
    installing Cilium, running connectivity tests and monitoring its status
    with the same tool. Each module pairs a layered reader with an ungraded
    hands-on playground and a graded lab. Each section closes with a
    capstone lab and a knowledge check. Targets Kubernetes 1.35, Cilium
    1.20.3 and Cilium CLI 0.20.2. Content is draft and the labs have not
    been run against a live cluster.

  certification:
    name: Cilium Certified Associate
    code: CCA
    provider: CNCF / Linux Foundation
    domain: Installation and Configuration
    weight: 10
    competencies:
      - "Know How to Use Cilium CLI to Query and Modify the Configuration"
      - "Using Cilium CLI to Install Cilium, Run Connectivity Tests, and Monitor its Status"

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md


