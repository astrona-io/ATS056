# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Change Cilium Configuration (PLAYGROUND). A clean sandbox: it starts, runs the seed script and
# then stays running for free exploration. No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-056-pg-010-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16

bootstrap:
  init:
    - name: seed-cluster
      description: Prepare the starting state of the playground
      type: file
      source: bootstrap/01-seed-cluster.sh

teardown:
  keepCluster: false
