# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Query And Modify The Cilium Configuration Capstone (LAB). Graded against the live cluster. UNTESTED: never run.
# Query the live Cilium configuration, report it, change two settings and prove the agents run with them.
apiVersion: astrona.io/v1
metadata:
  name: ats-056-cap-010
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16

bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state of the lab
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: config-report
      description: "config-audit in starfleet holds the live tunnel-protocol, enable-policy and ipam values"
      type: file
      source: validation/validate-config-report.sh
      hint: "Read the values with cilium config view. Create the ConfigMap with the keys tunnel-protocol, enable-policy and ipam. Do the report before you change settings."
    - name: version-report
      description: "config-audit key agent-version holds the agent version tag"
      type: file
      source: validation/validate-version-report.sh
      hint: "Find the version with cilium version or in the agent image of the cilium DaemonSet. Use the tag, for example v1.20.3."
    - name: settings-changed
      description: "debug is true and monitor-aggregation is maximum in cilium-config"
      type: file
      source: validation/validate-settings-changed.sh
      hint: "Use cilium config set debug true and cilium config set monitor-aggregation maximum."
    - name: agents-restarted
      description: "Every agent pod started after the lab began"
      type: file
      source: validation/validate-agents-restarted.sh
      hint: "The agents read the ConfigMap at start. Let cilium config set restart them, then wait for them to become ready."
    - name: cilium-ready
      description: "All agents are ready after the change"
      type: file
      source: validation/validate-cilium-ready.sh
      hint: "Wait with cilium status --wait or kubectl -n kube-system rollout status daemonset/cilium."
    - name: protected-settings
      description: "Guard: tunnel-protocol, enable-policy, ipam and Helm revision are unchanged"
      type: file
      source: validation/validate-protected-settings.sh
      hint: "Change only the two settings in the task and do not use helm. This check passes before any action."

teardown:
  keepCluster: false
