# Final domain knowledge check across both sections, including the datapath settings, Helm, agent debug, troubleshooting and monitor modules.
schema_version: 1
kind: question_bank
id: ats056-final
course_id: ATS056
exam_code: CCA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: installation-and-configuration
  title: "Installation and Configuration"
questions:
  - id: ats056-final-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the object that holds the Cilium configuration"
    source_readings:
      - sections/section-010/module-01/course-01-where-the-configuration-lives.md
    prompt: "A platform engineer wants to read the settings that every Cilium agent loads at start. Where do these settings live in a Helm installation?"
    options:
      - id: a
        text: "In a custom resource named `CiliumConfig` in the `starfleet` namespace."
        explanation: "This option does not match the mechanism. The agents read the keys of the ConfigMap `cilium-config`. Helm renders the values into that ConfigMap. The chart defines no custom resource for the configuration, and a values file on a laptop is only an input to Helm."
      - id: b
        text: "In the DaemonSet `cilium`, as the only place the settings are stored."
        explanation: "This option does not match the mechanism. The agents read the keys of the ConfigMap `cilium-config`. Helm renders the values into that ConfigMap. The chart defines no custom resource for the configuration, and a values file on a laptop is only an input to Helm."
      - id: c
        text: "In the Helm values file on the engineer's machine."
        explanation: "This option does not match the mechanism. The agents read the keys of the ConfigMap `cilium-config`. Helm renders the values into that ConfigMap. The chart defines no custom resource for the configuration, and a values file on a laptop is only an input to Helm."
      - id: d
        text: "In the ConfigMap `cilium-config` in the `kube-system` namespace."
        explanation: "Correct. The agents read the keys of the ConfigMap `cilium-config`. Helm renders the values into that ConfigMap. The chart defines no custom resource for the configuration, and a values file on a laptop is only an input to Helm."
    correct_option: d
    explanation: "The agents read the keys of the ConfigMap `cilium-config`. Helm renders the values into that ConfigMap. The chart defines no custom resource for the configuration, and a values file on a laptop is only an input to Helm."

  - id: ats056-final-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Map a Helm value to its configuration key"
    source_readings:
      - sections/section-010/module-01/course-01-where-the-configuration-lives.md
    prompt: "A cluster was installed with the Helm value `policyEnforcementMode=never`. Which key shows this setting in the output of `cilium config view`?"
    options:
      - id: a
        text: "`policy`"
        explanation: "This option does not match the mechanism. The chart renders `policyEnforcementMode` as the key `enable-policy`. The names of values and keys do not always match, so map them before you search."
      - id: b
        text: "`enforcement`"
        explanation: "This option does not match the mechanism. The chart renders `policyEnforcementMode` as the key `enable-policy`. The names of values and keys do not always match, so map them before you search."
      - id: c
        text: "`policy-enforcement-mode`"
        explanation: "This option does not match the mechanism. The chart renders `policyEnforcementMode` as the key `enable-policy`. The names of values and keys do not always match, so map them before you search."
      - id: d
        text: "`enable-policy`"
        explanation: "Correct. The chart renders `policyEnforcementMode` as the key `enable-policy`. The names of values and keys do not always match, so map them before you search."
    correct_option: d
    explanation: "The chart renders `policyEnforcementMode` as the key `enable-policy`. The names of values and keys do not always match, so map them before you search."

  - id: ats056-final-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Compare the stored value with the effective state of an agent"
    source_readings:
      - sections/section-010/module-01/course-02-effective-state-and-features.md
    prompt: "The ConfigMap shows `debug: \"true\"`, but one agent still logs at the normal level. Which explanation fits?"
    options:
      - id: a
        text: "Debug logging is disabled for every agent until Hubble is enabled."
        explanation: "This option does not match the mechanism. An agent reads the ConfigMap at start. A changed ConfigMap reaches an agent only after it restarts, so the stored value and the effective value can differ."
      - id: b
        text: "The ConfigMap is wrong, because it is never the source of the settings."
        explanation: "This option does not match the mechanism. An agent reads the ConfigMap at start. A changed ConfigMap reaches an agent only after it restarts, so the stored value and the effective value can differ."
      - id: c
        text: "That agent was started before the change and reads the ConfigMap only when it starts."
        explanation: "Correct. An agent reads the ConfigMap at start. A changed ConfigMap reaches an agent only after it restarts, so the stored value and the effective value can differ."
      - id: d
        text: "`cilium config view` always prints stale values."
        explanation: "This option does not match the mechanism. An agent reads the ConfigMap at start. A changed ConfigMap reaches an agent only after it restarts, so the stored value and the effective value can differ."
    correct_option: c
    explanation: "An agent reads the ConfigMap at start. A changed ConfigMap reaches an agent only after it restarts, so the stored value and the effective value can differ."

  - id: ats056-final-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe what cilium config set changes"
    source_readings:
      - sections/section-010/module-02/course-01-what-cilium-config-set-does.md
    prompt: "A learner runs `cilium config set debug true` on a Helm installation. What did the command change?"
    options:
      - id: a
        text: "The Helm release values and the ConfigMap."
        explanation: "This option does not match the mechanism. The command patches the ConfigMap `cilium-config`. It does not edit the values of the Helm release, which is why a later upgrade can disagree with the change."
      - id: b
        text: "Only the ConfigMap `cilium-config`; the Helm values are unchanged."
        explanation: "Correct. The command patches the ConfigMap `cilium-config`. It does not edit the values of the Helm release, which is why a later upgrade can disagree with the change."
      - id: c
        text: "Only the logs of the agent; no object changed."
        explanation: "This option does not match the mechanism. The command patches the ConfigMap `cilium-config`. It does not edit the values of the Helm release, which is why a later upgrade can disagree with the change."
      - id: d
        text: "The DaemonSet template, so new nodes use the key."
        explanation: "This option does not match the mechanism. The command patches the ConfigMap `cilium-config`. It does not edit the values of the Helm release, which is why a later upgrade can disagree with the change."
    correct_option: b
    explanation: "The command patches the ConfigMap `cilium-config`. It does not edit the values of the Helm release, which is why a later upgrade can disagree with the change."

  - id: ats056-final-q05
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain who owns a setting after a manual change"
    source_readings:
      - sections/section-010/module-02/course-03-who-owns-the-setting.md
    prompt: "A team changed `debug` with `cilium config set`. Later someone runs `helm upgrade` with the same chart and values. What can happen to the manual change?"
    options:
      - id: a
        text: "It always disappears, because Helm replaces the whole ConfigMap."
        explanation: "This option does not match the mechanism. Helm merges the old manifest, the new manifest and the live object. A manual edit of a key that the chart also renders can be kept or overwritten. Putting the setting in the Helm values makes the result certain."
      - id: b
        text: "It can be kept or overwritten, depending on how Helm merges the live object with the old and new chart. A lasting change belongs in the Helm values."
        explanation: "Correct. Helm merges the old manifest, the new manifest and the live object. A manual edit of a key that the chart also renders can be kept or overwritten. Putting the setting in the Helm values makes the result certain."
      - id: c
        text: "It moves to the DaemonSet and stays there."
        explanation: "This option does not match the mechanism. Helm merges the old manifest, the new manifest and the live object. A manual edit of a key that the chart also renders can be kept or overwritten. Putting the setting in the Helm values makes the result certain."
      - id: d
        text: "It always survives, because Helm never touches keys it did not set."
        explanation: "This option does not match the mechanism. Helm merges the old manifest, the new manifest and the live object. A manual edit of a key that the chart also renders can be kept or overwritten. Putting the setting in the Helm values makes the result certain."
    correct_option: b
    explanation: "Helm merges the old manifest, the new manifest and the live object. A manual edit of a key that the chart also renders can be kept or overwritten. Putting the setting in the Helm values makes the result certain."

  - id: ats056-final-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "State the prerequisites of a Cilium install"
    source_readings:
      - sections/section-020/module-01/course-01-prerequisites-and-what-gets-installed.md
    prompt: "Which condition must be true before `cilium install` is run on a cluster?"
    options:
      - id: a
        text: "The nodes have a public IP address."
        explanation: "This option does not match the mechanism. Cilium loads BPF programs and needs a recent kernel. A second network plugin conflicts with it. The other options are not prerequisites."
      - id: b
        text: "Hubble Relay is already running."
        explanation: "This option does not match the mechanism. Cilium loads BPF programs and needs a recent kernel. A second network plugin conflicts with it. The other options are not prerequisites."
      - id: c
        text: "The nodes run Linux kernel 5.10 or newer, and no other network plugin is installed."
        explanation: "Correct. Cilium loads BPF programs and needs a recent kernel. A second network plugin conflicts with it. The other options are not prerequisites."
      - id: d
        text: "The cluster has at least three control plane nodes."
        explanation: "This option does not match the mechanism. Cilium loads BPF programs and needs a recent kernel. A second network plugin conflicts with it. The other options are not prerequisites."
    correct_option: c
    explanation: "Cilium loads BPF programs and needs a recent kernel. A second network plugin conflicts with it. The other options are not prerequisites."

  - id: ats056-final-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Set chart values during an install"
    source_readings:
      - sections/section-020/module-01/course-02-install-options-and-values.md
    prompt: "Which command installs Cilium 1.20.3 with the Helm value `ipam.mode` set to `kubernetes`?"
    options:
      - id: a
        text: "`helm set ipam.mode=kubernetes cilium`"
        explanation: "This option does not match the mechanism. `--set` passes chart values, in the same way as in Helm. `cilium config set` needs an installation that already exists."
      - id: b
        text: "`cilium install --version 1.20.3 --set ipam.mode=kubernetes`"
        explanation: "Correct. `--set` passes chart values, in the same way as in Helm. `cilium config set` needs an installation that already exists."
      - id: c
        text: "`cilium install --ipam kubernetes --version 1.20.3`"
        explanation: "This option does not match the mechanism. `--set` passes chart values, in the same way as in Helm. `cilium config set` needs an installation that already exists."
      - id: d
        text: "`cilium config set ipam kubernetes` before the install"
        explanation: "This option does not match the mechanism. `--set` passes chart values, in the same way as in Helm. `cilium config set` needs an installation that already exists."
    correct_option: b
    explanation: "`--set` passes chart values, in the same way as in Helm. `cilium config set` needs an installation that already exists."

  - id: ats056-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe the default values behaviour of cilium upgrade"
    source_readings:
      - sections/section-020/module-01/course-03-verify-upgrade-and-uninstall.md
    prompt: "What does `cilium upgrade` do with the values of the current release when no values flag is given?"
    options:
      - id: a
        text: "It discards them and applies the chart defaults."
        explanation: "This option does not match the mechanism. The default is `--reset-then-reuse-values`. Use `--reuse-values` or `--reset-values` for the other behaviours, and `--dry-run` to see the result first."
      - id: b
        text: "It resets to the new chart defaults and then reuses the values that you set earlier (`--reset-then-reuse-values`)."
        explanation: "Correct. The default is `--reset-then-reuse-values`. Use `--reuse-values` or `--reset-values` for the other behaviours, and `--dry-run` to see the result first."
      - id: c
        text: "It refuses to run."
        explanation: "This option does not match the mechanism. The default is `--reset-then-reuse-values`. Use `--reuse-values` or `--reset-values` for the other behaviours, and `--dry-run` to see the result first."
      - id: d
        text: "It deletes the ConfigMap first."
        explanation: "This option does not match the mechanism. The default is `--reset-then-reuse-values`. Use `--reuse-values` or `--reset-values` for the other behaviours, and `--dry-run` to see the result first."
    correct_option: b
    explanation: "The default is `--reset-then-reuse-values`. Use `--reuse-values` or `--reset-values` for the other behaviours, and `--dry-run` to see the result first."

  - id: ats056-final-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what uninstall leaves behind"
    source_readings:
      - sections/section-020/module-01/course-03-verify-upgrade-and-uninstall.md
    prompt: "After `cilium uninstall`, why can pods on a node still have trouble even though the Cilium pods are gone?"
    options:
      - id: a
        text: "The command only stops the agents and keeps the operator."
        explanation: "This option does not match the mechanism. By default the CNI configuration is not removed from the nodes, so a node can keep pointing at a plugin that no longer runs."
      - id: b
        text: "The command deletes the nodes."
        explanation: "This option does not match the mechanism. By default the CNI configuration is not removed from the nodes, so a node can keep pointing at a plugin that no longer runs."
      - id: c
        text: "Uninstall never removes the Helm release."
        explanation: "This option does not match the mechanism. By default the CNI configuration is not removed from the nodes, so a node can keep pointing at a plugin that no longer runs."
      - id: d
        text: "The CNI configuration file stays on the nodes by default, because `cni.uninstall` is false."
        explanation: "Correct. By default the CNI configuration is not removed from the nodes, so a node can keep pointing at a plugin that no longer runs."
    correct_option: d
    explanation: "By default the CNI configuration is not removed from the nodes, so a node can keep pointing at a plugin that no longer runs."

  - id: ats056-final-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain the flow validation modes"
    source_readings:
      - sections/section-020/module-02/course-03-flow-validation-and-failures.md
    prompt: "A run passes all requests, but Hubble did not see the expected flows. What does the default `--flow-validation warning` do, and what would `strict` do?"
    options:
      - id: a
        text: "`warning` skips the requests; `strict` runs them."
        explanation: "This option does not match the mechanism. The default mode warns. Strict mode fails the scenario when the observed flows do not match the expectation, which proves that the traffic went through Cilium."
      - id: b
        text: "Both pass the scenario silently."
        explanation: "This option does not match the mechanism. The default mode warns. Strict mode fails the scenario when the observed flows do not match the expectation, which proves that the traffic went through Cilium."
      - id: c
        text: "`warning` prints a warning and the scenario passes if the request worked; `strict` fails the scenario."
        explanation: "Correct. The default mode warns. Strict mode fails the scenario when the observed flows do not match the expectation, which proves that the traffic went through Cilium."
      - id: d
        text: "Both fail the scenario."
        explanation: "This option does not match the mechanism. The default mode warns. Strict mode fails the scenario when the observed flows do not match the expectation, which proves that the traffic went through Cilium."
    correct_option: c
    explanation: "The default mode warns. Strict mode fails the scenario when the observed flows do not match the expectation, which proves that the traffic went through Cilium."

  - id: ats056-final-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the exit code of cilium status"
    source_readings:
      - sections/section-020/module-03/course-01-reading-cilium-status.md
    prompt: "A pipeline runs `cilium status` and checks `$?`. The agents are not ready. What does the pipeline see?"
    options:
      - id: a
        text: "A timeout of five minutes."
        explanation: "This option does not match the mechanism. A plain `cilium status` prints the state and ends. With `--wait` it waits for a clean status and exits non-zero when the time runs out."
      - id: b
        text: "A non-zero exit code, because a component is unhealthy."
        explanation: "This option does not match the mechanism. A plain `cilium status` prints the state and ends. With `--wait` it waits for a clean status and exits non-zero when the time runs out."
      - id: c
        text: "A zero exit code, because a plain run fails only when it cannot collect the status. Use `--wait` for a decision."
        explanation: "Correct. A plain `cilium status` prints the state and ends. With `--wait` it waits for a clean status and exits non-zero when the time runs out."
      - id: d
        text: "A zero exit code only with `-o json`."
        explanation: "This option does not match the mechanism. A plain `cilium status` prints the state and ends. With `--wait` it waits for a clean status and exits non-zero when the time runs out."
    correct_option: c
    explanation: "A plain `cilium status` prints the state and ends. With `--wait` it waits for a clean status and exits non-zero when the time runs out."

  - id: ats056-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Repair a component with no replicas"
    source_readings:
      - sections/section-020/module-03/course-02-agent-status-and-workload-health.md
    prompt: "`cilium status` shows the relay as unavailable and `kubectl get deploy hubble-relay -n kube-system` shows `0/0`. What is the right repair?"
    options:
      - id: a
        text: "`kubectl -n kube-system scale deploy/hubble-relay --replicas=1`"
        explanation: "Correct. A Deployment scaled to zero has no pods to inspect, so set the replica count. A DaemonSet has no replica count, and the relay is a workload object, not a ConfigMap key."
      - id: b
        text: "`kubectl -n kube-system scale ds/cilium --replicas=1`"
        explanation: "This option does not match the mechanism. A Deployment scaled to zero has no pods to inspect, so set the replica count. A DaemonSet has no replica count, and the relay is a workload object, not a ConfigMap key."
      - id: c
        text: "`cilium config set hubble-relay true`"
        explanation: "This option does not match the mechanism. A Deployment scaled to zero has no pods to inspect, so set the replica count. A DaemonSet has no replica count, and the relay is a workload object, not a ConfigMap key."
      - id: d
        text: "Delete the node."
        explanation: "This option does not match the mechanism. A Deployment scaled to zero has no pods to inspect, so set the replica count. A DaemonSet has no replica count, and the relay is a workload object, not a ConfigMap key."
    correct_option: a
    explanation: "A Deployment scaled to zero has no pods to inspect, so set the replica count. A DaemonSet has no replica count, and the relay is a workload object, not a ConfigMap key."

  - id: ats056-final-q13
    type: single_choice
    difficulty: beginner
    learning_objective: "Say who allocates node ranges in cluster pool mode"
    source_readings:
      - sections/section-010/module-03/course-01-ipam-modes.md
    prompt: "In a cluster that uses the `cluster-pool` IPAM mode, which component splits the cluster-wide range into one range for each node?"
    options:
      - id: a
        text: "The Kubernetes controller manager."
        explanation: "Not correct. The controller manager fills node.spec.podCIDR, which only the kubernetes IPAM mode uses."
      - id: b
        text: "The Cilium agent on each node."
        explanation: "Not correct. The agent hands out single addresses from a range it already has. It does not create the node range."
      - id: c
        text: "The Cilium operator."
        explanation: "Correct. The operator splits the pool and writes the result into the CiliumNode resource of each node."
      - id: d
        text: "The kubelet."
        explanation: "Not correct. The kubelet starts pods and asks the network plugin for an address. It does not allocate ranges."
    correct_option: c
    explanation: "In cluster pool mode the operator owns the ranges and records them in the CiliumNode resources."

  - id: ats056-final-q14
    type: single_choice
    difficulty: advanced
    learning_objective: "Apply the default enforcement mode"
    source_readings:
      - sections/section-010/module-03/course-04-policy-enforcement-and-safe-changes.md
    prompt: "A cluster runs with `enable-policy: default`. A `CiliumNetworkPolicy` with ingress rules selects only the `probe` pod. What happens to the `shuttle` pod, which no policy selects?"
    options:
      - id: a
        text: "It denies all ingress and egress."
        explanation: "Not correct. That is the behaviour of always, not default."
      - id: b
        text: "It also ignores policy, as in `never`, and the cluster has no enforcement at all."
        explanation: "Not correct. Enforcement is on for the selected pod, so the cluster still enforces policy."
      - id: c
        text: "It accepts all traffic, because enforcement applies only to selected endpoints."
        explanation: "Correct. In default mode an endpoint that no policy selects stays open, and only the `probe` pod is restricted."
      - id: d
        text: "It is removed from the node."
        explanation: "Not correct. Policy never deletes pods."
    correct_option: c
    explanation: "Default mode applies policy to selected endpoints only."

  - id: ats056-final-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Locate the Helm release records"
    source_readings:
      - sections/section-020/module-04/course-01-repository-chart-and-release.md
    prompt: "Where does Helm store the history of the release `cilium`?"
    options:
      - id: a
        text: "In the ConfigMap `cilium-config`."
        explanation: "Not correct. That ConfigMap holds agent settings, not release history."
      - id: b
        text: "In a file on the machine that ran `helm install`."
        explanation: "Not correct. Helm keeps release state in the cluster, so another machine can upgrade the release."
      - id: c
        text: "In Secrets of type `helm.sh/release.v1` in the release namespace."
        explanation: "Correct. Each revision is a Secret such as sh.helm.release.v1.cilium.v1."
      - id: d
        text: "In the DaemonSet `cilium`."
        explanation: "Not correct. The DaemonSet is one of the objects of the release, not its record."
    correct_option: c
    explanation: "Release revisions are Secrets in the release namespace."

  - id: ats056-final-q16
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain the pre-flight step"
    source_readings:
      - sections/section-020/module-04/course-03-upgrade-history-and-rollback.md
    prompt: "What does the Cilium pre-flight chart check before an upgrade?"
    options:
      - id: a
        text: "That the new agent version can read the existing state, using a copy of the new agent that runs next to the real agents."
        explanation: "Correct. It is installed with agent and operator disabled and the preflight value on, and it exposes problems before the real rollout."
      - id: b
        text: "That the node kernel is newer than 5.10."
        explanation: "Not correct. Kernel checks are not the job of the pre-flight chart."
      - id: c
        text: "That every Service has a backend."
        explanation: "Not correct. Service backends are not part of the pre-flight check."
      - id: d
        text: "That the Helm repository is reachable."
        explanation: "Not correct. A repository check is done by helm repo update, not by this chart."
    correct_option: a
    explanation: "The pre-flight chart tests the new version against the existing state."

  - id: ats056-final-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Contrast the two config tools"
    source_readings:
      - sections/section-010/module-04/course-02-agent-status-and-runtime-options.md
    prompt: "An engineer turns on debug logging in one agent with `cilium-dbg config Debug=Enable`. What is true afterwards?"
    options:
      - id: a
        text: "All agents log in debug mode and the ConfigMap has a new key."
        explanation: "Not correct. That describes `cilium config set`."
      - id: b
        text: "The change affects only that agent and is lost when its pod restarts."
        explanation: "Correct. The ConfigMap is not written."
      - id: c
        text: "The Helm release has a new revision."
        explanation: "Not correct. The command does not touch Helm."
      - id: d
        text: "The change is stored in the CiliumEndpoint object."
        explanation: "Not correct. Endpoints do not hold agent options."
    correct_option: b
    explanation: "The ConfigMap is not written."

  - id: ats056-final-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find the identity of a pod"
    source_readings:
      - sections/section-010/module-04/course-03-endpoints-and-identities.md
    prompt: "Where can you read the numeric security identity of the pod `probe` in the agent of its node?"
    options:
      - id: a
        text: "In the output of `cilium-dbg endpoint list` or `cilium-dbg identity list`."
        explanation: "Correct. Both tables show identities."
      - id: b
        text: "In `cilium status`."
        explanation: "Not correct. It reports workloads, not identities."
      - id: c
        text: "In the Helm values."
        explanation: "Not correct. Identities are allocated at runtime, not set in values."
      - id: d
        text: "In `cilium config view`."
        explanation: "Not correct. It shows ConfigMap keys."
    correct_option: a
    explanation: "Both tables show identities."

  - id: ats056-final-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Repair a bad DaemonSet change"
    source_readings:
      - sections/section-020/module-05/course-02-agent-pods-that-do-not-start.md
    prompt: "The agent DaemonSet was changed with `kubectl set image` to an image that does not exist, and the agents show `ImagePullBackOff`. What is the most direct repair?"
    options:
      - id: a
        text: "`cilium uninstall` followed by `cilium install`."
        explanation: "Not correct. This removes networking and is a last resort."
      - id: b
        text: "`kubectl delete pod` for each agent pod."
        explanation: "Not correct. The DaemonSet recreates the pods with the same bad image."
      - id: c
        text: "`kubectl -n kube-system rollout undo daemonset/cilium`."
        explanation: "Correct. It restores the previous pod template."
      - id: d
        text: "`cilium config delete` for the image key."
        explanation: "Not correct. The image is not a ConfigMap key."
    correct_option: c
    explanation: "It restores the previous pod template."

  - id: ats056-final-q20
    type: single_choice
    difficulty: advanced
    learning_objective: "Know the API server values"
    source_readings:
      - sections/section-020/module-05/course-03-nodes-and-pods-without-network.md
    prompt: "A cluster has no kube-proxy, and the agents never become ready because they cannot reach the API server. Which pair of values fixes the start?"
    options:
      - id: a
        text: "`k8sServiceHost` and `k8sServicePort`."
        explanation: "Correct. They give the agent the real API server address."
      - id: b
        text: "`kubeProxyReplacement` and `routingMode`."
        explanation: "Not correct. They select datapath behaviour, not the API server address."
      - id: c
        text: "`ipam.mode` and `cluster.name`."
        explanation: "Not correct. They set address management and the cluster name."
      - id: d
        text: "`debug.enabled` and `hubble.enabled`."
        explanation: "Not correct. They turn on logging and Hubble."
    correct_option: a
    explanation: "They give the agent the real API server address."

  - id: ats056-final-q21
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use the monitor"
    source_readings:
      - sections/section-020/module-06/course-03-watching-events-with-cilium-dbg-monitor.md
    prompt: "A request from `shuttle` to `probe` times out. Which command shows drops on the node of `probe` as they happen?"
    options:
      - id: a
        text: "`cilium-dbg monitor -t drop` in the agent pod on the node of `shuttle`."
        explanation: "Not correct. An ingress drop is not reported by the source node."
      - id: b
        text: "`cilium-dbg monitor -t drop` in the agent pod on the node of `probe`."
        explanation: "Correct. Ingress drops are reported by the node of the destination."
      - id: c
        text: "`cilium status --wait`."
        explanation: "Not correct. It shows component health, not packets."
      - id: d
        text: "`cilium connectivity test --cleanup`."
        explanation: "Not correct. It removes test objects."
    correct_option: b
    explanation: "Ingress drops are reported by the node of the destination."

  - id: ats056-final-q22
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a drop reason"
    source_readings:
      - sections/section-020/module-06/course-04-reading-drops-and-policy-verdicts.md
    prompt: "A drop event reads \"Policy denied\" with two identity numbers. What does it tell you?"
    options:
      - id: a
        text: "The two nodes cannot reach each other."
        explanation: "Not correct. A routing fault shows a different reason."
      - id: b
        text: "The Cilium agent is unhealthy."
        explanation: "Not correct. An unhealthy agent does not produce this reason."
      - id: c
        text: "A policy selects the pod and no rule allows the source identity, port and protocol."
        explanation: "Correct. The reason names the check that failed."
      - id: d
        text: "The identity numbers are invalid."
        explanation: "Not correct. They are valid numbers for label sets."
    correct_option: c
    explanation: "The reason names the check that failed."
